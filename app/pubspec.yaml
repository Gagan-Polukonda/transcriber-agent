name: voice_to_text_local
description: Fully offline, local voice-to-text transcription app using Whisper.cpp.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Audio recording
  record: ^5.0.0

  # Local storage
  sqflite: ^2.2.8+4
  sqflite_common_ffi: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.0.15

  # UI & State Management
  provider: ^6.0.0

  # Date formatting
  intl: ^0.19.0

  # UUID generation
  uuid: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  ffigen: 20.1.1

dependency_overrides:
  record_linux: ^1.1.0

flutter:
  uses-material-design: true
